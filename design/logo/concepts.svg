<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="840" viewBox="0 0 1600 840"><defs><filter id="grey"><feColorMatrix type="saturate" values="0"/></filter></defs><rect width="1600" height="840" fill="#f7f7f4"/><text x="60" y="78" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#161616">Logo concepts</text><text x="60" y="116" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#6b6b6b">Concepts for review — pick a direction (or tell me what you like in each).</text><rect x="60" y="150" width="474.667" height="630" rx="18" fill="#fff" stroke="#161616" stroke-width="2"/><g filter="url(#grey)">
<!--
  Wand — concept A, letterform.

  Construction: a 256 grid, cap height 152 (y=52 to y=204), stroke weight 30,
  inner joints on a 32 grid, outer edges vertical.

  The W is one outline so the joints are exact. Its middle vertex rises to
  y=132 — above the baseline, below the cap line — which leaves a notch between
  the two inner strokes. One square sits in that notch, not on top of it: the
  tile that is picked out of the row, held by the letter rather than balanced
  on it.
-->
<svg fill="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="90" y="190" width="414.667" height="300" preserveAspectRatio="xMidYMid meet">
  <g fill="#000000">
    <!-- The W: two outer verticals and two inner diagonals meeting at y=132. -->
    <path d="M28 52 H62 L96 176 L128 120 L160 176 L194 52 H228 L182 204 H150 L128 152 L106 204 H74 L28 52 Z"/>
    <!-- The picked-out tile, seated in the notch the raised vertex leaves. -->
    <rect x="112" y="76" width="32" height="32" rx="6" fill="#000000"/>
  </g>
</svg>
</g><g filter="url(#grey)">
